services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    # Exposed on the host so local dev (`pnpm dev`) can reach it via .env's DATABASE_URL.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/url_shortener?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
