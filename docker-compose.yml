services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=http://localhost:3000
      - DATABASE_URL=file:/app/applications/web/data/prod.db
    volumes:
      - db_data:/app/applications/web/data

volumes:
  db_data:
