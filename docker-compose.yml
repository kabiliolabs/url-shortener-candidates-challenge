services:
  postgres:
    image: postgres:16-alpine
    environment:
    # This is not best practice for production, but for development purposes, we can use a simple password.
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=url_shortener
    ports:
      # For production env do not expose the port to the host, as it can be a security risk.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/url_shortener?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
