services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=url_shortener
      - POSTGRES_PASSWORD=url_shortener
      - POSTGRES_DB=url_shortener
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=http://localhost:3000
      - DATABASE_URL=postgresql://url_shortener:url_shortener@db:5432/url_shortener?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
