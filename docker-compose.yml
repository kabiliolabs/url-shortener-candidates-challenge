services:
  api:
    build:
      context: .
      dockerfile: applications/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - PUBLIC_URL=http://localhost:3000
      - MONGODB_URI=mongodb://root:example@mongo:27017/url_shortener?authSource=admin&replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=http://localhost:3000
      - API_URL=http://localhost:4000
    depends_on:
      - api

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/configdb/keyfile ]; then
          mkdir -p /data/configdb
          head -c 756 /dev/urandom | base64 > /data/configdb/keyfile
          chmod 400 /data/configdb/keyfile
          chown 999:999 /data/configdb/keyfile
        fi
        exec docker-entrypoint.sh mongod --bind_ip_all --replSet rs0 --keyFile /data/configdb/keyfile
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username root --password example --authenticationDatabase admin --eval 'try { rs.status(); } catch (error) { rs.initiate({_id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }]}); }; if (!db.hello().isWritablePrimary) { quit(1); }'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  mongo-config:
